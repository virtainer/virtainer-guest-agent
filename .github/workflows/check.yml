name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Installs the toolchain and musl target pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-about@0.9.2,cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Bundled licence texts are in the binary
        run: |
          out=$(./target/x86_64-unknown-linux-musl/release/virtainer-guest-agent licenses)
          for needle in "Apache License" "Kata Containers" "musl as a whole is licensed" \
                        "Third-party Rust crates" "Rust standard library"; do
            grep -qF -- "$needle" <<<"$out" || { echo "missing from licenses output: $needle" >&2; exit 1; }
          done
      - name: Licence bundle matches Cargo.lock
        run: tools/third-party-licenses.sh --check
      - run: cargo deny check licenses advisories
