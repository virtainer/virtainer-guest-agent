[package]
name = "virtainer-guest-agent"
version = "0.4.0"
edition = "2021"
rust-version = "1.95"
description = "QEMU Guest Agent compatible agent for Linux VMs on Cloud Hypervisor (vsock)"
license = "Apache-2.0"
repository = "https://github.com/virtainer/virtainer-guest-agent"
homepage = "https://virtainer.io"
readme = "README.md"
keywords = ["qemu-guest-agent", "vsock", "cloud-hypervisor", "virtualization", "guest-agent"]
categories = ["virtualization", "command-line-utilities"]
publish = false

# A standalone crate: never part of a workspace it happens to be checked out under.
[workspace]

[[bin]]
name = "virtainer-guest-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: replies keep QAPI member order, as qemu-ga writes them.
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
